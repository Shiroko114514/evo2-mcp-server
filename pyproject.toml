[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "evo2-mcp"
version = "0.1.0"
description = "MCP server exposing NVIDIA Evo2-7B Forward API as bioinformatics tools (DNA forward inference, likelihood scoring, variant effect prediction)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "wisp-science" },
]
keywords = ["mcp", "evo2", "dna", "bioinformatics", "nvidia", "nim", "foundation-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
evo2-mcp = "evo2_mcp.__main__:main"

[project.urls]
"NVIDIA API Reference" = "https://docs.api.nvidia.com/nim/reference/arc-evo2-7b-infer"
"NIM Endpoints" = "https://docs.nvidia.com/nim/bionemo/evo2/latest/endpoints.html"
"Arc Evo2 Repository" = "https://github.com/ArcInstitute/evo2"

[tool.hatch.build.targets.wheel]
packages = ["src/evo2_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# pixi (project-local environment) configuration
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
evo2-mcp = { path = ".", editable = true }

[tool.pixi.feature.dev]
pypi-dependencies = { pytest = ">=8.0", pytest-asyncio = ">=0.23" }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default", tasks = { test = "pytest -q" } }

[tool.pixi.tasks]
evo2-mcp = "evo2-mcp"
